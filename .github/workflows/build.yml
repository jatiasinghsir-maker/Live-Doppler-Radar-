      - name: Verify signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          KEYSTORE="${{ github.workspace }}/app/my-upload-key.jks"

          echo "======================================"
          echo "ANDROID SIGNING KEYSTORE DIAGNOSTIC"
          echo "======================================"

          echo "Checking file..."
          ls -lh "$KEYSTORE"

          echo "Checking file type..."
          file "$KEYSTORE"

          echo "Checking keystore with JKS format..."
          if keytool -list \
            -storetype JKS \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            2>&1; then

            echo "JKS_KEYSTORE_OK=true"

          else

            echo "JKS check failed."
            echo "Trying PKCS12 format..."

            if keytool -list \
              -storetype PKCS12 \
              -keystore "$KEYSTORE" \
              -storepass "$KEYSTORE_PASSWORD" \
              2>&1; then

              echo "PKCS12_KEYSTORE_OK=true"

            else

              echo "======================================"
              echo "KEYSTORE COULD NOT BE OPENED"
              echo "======================================"
              exit 1
            fi
          fi

          echo "Checking requested alias..."

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "======================================"
          echo "KEYSTORE + PASSWORD + ALIAS CHECK PASSED"
          echo "======================================"
