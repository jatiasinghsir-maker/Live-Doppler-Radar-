<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#112238" />
      <stop offset="50%" stop-color="#0A1424" />
      <stop offset="100%" stop-color="#040810" />
    </radialGradient>

    <!-- Radar Sweep Beam Gradient -->
    <linearGradient id="sweepBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="70%" stop-color="#00E5FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.45" />
    </linearGradient>

    <!-- Cyclone Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Spiral Arm Gradient 1 (Alert Coral/Red to Amber) -->
    <linearGradient id="spiralGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D55" />
      <stop offset="50%" stop-color="#FF3B30" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>

    <!-- Spiral Arm Gradient 2 (Amber to Neon Red) -->
    <linearGradient id="spiralGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF2D55" />
      <stop offset="60%" stop-color="#FF3B30" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#007AFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGradient)" />

  <!-- Subtle Tactical Tech Border -->
  <rect x="6" y="6" width="500" height="500" rx="104" fill="none" stroke="url(#borderGlow)" stroke-width="3" opacity="0.65" />

  <!-- Radar Grid & Concentric Range Rings -->
  <!-- Outer Range Ring (r = 205) -->
  <circle cx="256" cy="256" r="205" fill="none" stroke="#00E5FF" stroke-width="2.5" opacity="0.25" stroke-dasharray="8 6" />
  
  <!-- Middle Range Ring (r = 150) -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#00E5FF" stroke-width="2.5" opacity="0.4" />
  
  <!-- Inner Range Ring (r = 95) -->
  <circle cx="256" cy="256" r="95" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.55" />

  <!-- Crosshairs / Compass Axes -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#00E5FF" stroke-width="2" opacity="0.3" stroke-dasharray="6 4" />
  <line x1="56" y1="256" x2="456" y2="256" stroke="#00E5FF" stroke-width="2" opacity="0.3" stroke-dasharray="6 4" />
  <line x1="115" y1="115" x2="397" y2="397" stroke="#00E5FF" stroke-width="1.2" opacity="0.18" />
  <line x1="115" y1="397" x2="397" y2="115" stroke="#00E5FF" stroke-width="1.2" opacity="0.18" />

  <!-- Tactical Degree Ticks on Outer Ring -->
  <circle cx="256" cy="51" r="3.5" fill="#00E5FF" opacity="0.8" />
  <circle cx="256" cy="461" r="3.5" fill="#00E5FF" opacity="0.8" />
  <circle cx="51" cy="256" r="3.5" fill="#00E5FF" opacity="0.8" />
  <circle cx="461" cy="256" r="3.5" fill="#00E5FF" opacity="0.8" />

  <!-- Radar Sweeping Sector Beam (45-degree pie slice) -->
  <path d="M 256,256 L 397,115 A 200,200 0 0,0 256,56 Z" fill="url(#sweepBeam)" />
  <!-- Leading Sweeper Beam Line -->
  <line x1="256" y1="256" x2="397" y2="115" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)" />

  <!-- Radar Weather Intensity Arc (Lower Left quadrant) -->
  <path d="M 76,256 A 180,180 0 0,0 256,436" fill="none" stroke="#30D158" stroke-width="7" opacity="0.45" stroke-linecap="round" />
  <path d="M 106,256 A 150,150 0 0,0 256,406" fill="none" stroke="#FFD60A" stroke-width="6" opacity="0.55" stroke-linecap="round" />
  <path d="M 136,256 A 120,120 0 0,0 256,376" fill="none" stroke="#FF9F0A" stroke-width="5" opacity="0.6" stroke-linecap="round" />

  <!-- CENTRAL HURRICANE / CYCLONE SPIRAL (Iconic Emblem) -->
  <g filter="url(#glow)">
    <!-- Spiral Arm 1: Counter-clockwise outward plume -->
    <path d="M 256,212 C 195,212 148,258 148,312 C 148,354 178,390 220,398 C 190,370 178,332 198,296 C 218,258 256,248 256,212 Z" 
          fill="url(#spiralGrad1)" />

    <!-- Spiral Arm 2: Counter-clockwise opposite plume -->
    <path d="M 256,300 C 317,300 364,254 364,200 C 364,158 334,122 292,114 C 322,142 334,180 314,216 C 294,254 256,264 256,300 Z" 
          fill="url(#spiralGrad2)" />

    <!-- Outer Storm Swirl Ring Accents -->
    <circle cx="256" cy="256" r="48" fill="url(#spiralGrad1)" opacity="0.9" />
  </g>

  <!-- Cyclone Eye (Center Calm Void) -->
  <circle cx="256" cy="256" r="24" fill="#060D19" stroke="#FFCC00" stroke-width="2.5" />
  
  <!-- Glowing Cyan Beacon in Eye Center -->
  <circle cx="256" cy="256" r="11" fill="#00E5FF" filter="url(#softGlow)" />
  <circle cx="256" cy="256" r="5" fill="#FFFFFF" />

  <!-- Top Tactical Compass "N" Marker -->
  <polygon points="256,32 263,47 249,47" fill="#00E5FF" filter="url(#softGlow)" />
</svg>
